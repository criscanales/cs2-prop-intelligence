history_days: 183         # history window (last ~6 months); players keep maps from earlier teams
quickstart_days: 45       # first run: download this many recent days first, the rest backfills in the background
history_tiers: [s, a, b, c]  # bo3.gg tiers crawled as player/team history (tier C only adds history)
tiers: [s, a, b]          # bo3.gg tiers used for training/pricing (S/A = tier 1, B = tier 2)
team_maps_days: 92        # window for min_team_maps (tier-1/2 maps per team)
min_team_maps: 12         # both teams need this many tier-1/2 maps in the window (skips one-off teams)
min_edge: 0.03            # model P(side) - breakeven
min_maps: 15              # minimum prior maps for a player
max_line_gap: 0.35        # |model mean / line - 1| above this => flagged as suspicious, excluded
line_move_flag: 1.5       # line moved this many kills/HS since first seen => flagged
standin_tenure: 3         # fewer prior maps with current team => stand-in, excluded
role_shift_flag: 0.18     # |opening-duel win share last5 - last20| above this => role change flag
n_sims: 50000             # Monte Carlo draws for slips
n_sims_initial: 20000   # Monte Carlo draws per slip-candidate match; topped up (appended) to n_sims when needed
workers: 0              # pricing worker processes; 0 = auto (min(4, cores-1)), 1 = no parallelism
parallel_min_jobs: 3    # only use workers when at least this many matches need work
kelly_fraction: 0.25
bankroll: 1000
max_stake_pct: 0.03
auto_refresh_sec: 120         # dashboard checks for new/moved/pulled lines this often
results_refresh_min: 60       # dashboard pulls newly finished bo3.gg matches into history this often (min 15)
unverified_max_stake_pct: 0.005   # stake cap while payouts.yaml has verified: false       # per slip, of bankroll
daily_exposure_pct: 0.15  # all slips per day, of bankroll
max_legs_per_match: 2
top_n_slips: 10
retrain_days: 7             # app retrains the models in the background once they are this many days old
demon_lower_tier: false     # also price PrizePicks demons for teams below min_team_maps (sidebar toggle)
demon_min_team_maps: 4      # ...as long as each team has at least this many tier-1/2 maps
price_tier3: false          # also price lines for teams short on tier-1/2 maps as tier 3 (sidebar toggle)
tier3_min_edge: 0.06        # tier-3 lines need this edge (tier-3 calibrator applied first)
tier3_max_conf: B           # best confidence a tier-3 pick can get
collect_tier3: true         # with price_tier3 off, still price tier-3 lines in the background (hidden) and log them for the reliability check
