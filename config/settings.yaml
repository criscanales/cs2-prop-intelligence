history_days: 92          # training window (last ~3 months)
tiers: [s, a, b]          # bo3.gg tiers used for training/pricing (S/A = tier 1, B = tier 2)
min_team_maps: 12         # both teams need this many tier-1/2 maps in the window (skips one-off teams)
min_edge: 0.03            # model P(side) - breakeven
min_maps: 15              # minimum prior maps for a player
max_line_gap: 0.35        # |model mean / line - 1| above this => flagged as suspicious, excluded
line_move_flag: 1.5       # line moved this many kills/HS since first seen => flagged
standin_tenure: 3         # fewer prior maps with current team => stand-in, excluded
role_shift_flag: 0.18     # |opening-duel win share last5 - last20| above this => role change flag
n_sims: 50000             # Monte Carlo draws for slips
kelly_fraction: 0.25
bankroll: 1000
max_stake_pct: 0.03
unverified_max_stake_pct: 0.005   # stake cap while payouts.yaml has verified: false       # per slip, of bankroll
daily_exposure_pct: 0.15  # all slips per day, of bankroll
max_legs_per_match: 2
top_n_slips: 10
