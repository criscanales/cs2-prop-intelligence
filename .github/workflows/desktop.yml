name: desktop-build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: runner.os == 'macOS'
        run: brew install libomp
      - run: pip install -r requirements.txt pyinstaller==6.22.3 pywebview==5.3.2
      - run: python desktop/build.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\CS2 Props\CS2 Props.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:USERPROFILE\CS2Props\selftest.txt"
          exit $p.ExitCode
      - if: runner.os == 'macOS'
        run: '"dist/CS2 Props.app/Contents/MacOS/CS2 Props" --selftest'
      - if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent "CS2 Props.app" CS2Props-mac.zip
      - if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist/CS2 Props" -DestinationPath dist/CS2Props-windows.zip
      - if: runner.os == 'macOS'
        run: cd dist && shasum -a 256 CS2Props-mac.zip > CS2Props-mac.zip.sha256 && cat CS2Props-mac.zip.sha256
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/CS2Props-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$h  CS2Props-windows.zip" | Out-File -Encoding ascii -NoNewline dist/CS2Props-windows.zip.sha256
          Get-Content dist/CS2Props-windows.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: CS2Props-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.sha256
